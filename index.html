      // A. EKSPOR LAPORAN PDF RESMI (Format Standar Cetak A4 Portrait)
      async function exportToPdf() {
        showToast("Menyiapkan dokumen Laporan Rencana & Realisasi PDF (Portrait)...");

        try {
          const JsPDF = window.jspdf?.jsPDF || window.jsPDF;
          if (!JsPDF) {
            showToast("Modul PDF sedang dimuat, mohon coba sesaat lagi...");
            return;
          }

          const dim = dimensions();
          const sum = totals();
          const sched = calculateScheduleData();

          const dateStr = new Date().toLocaleDateString("id-ID", {
            year: "numeric", month: "long", day: "numeric",
          });

          // Inisialisasi dokumen jsPDF (Format A4 Portrait — Pas saat dicetak hardcopy)
          const doc = new JsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

          const PW = 210; // Page width A4 (210 mm)
          const PH = 297; // Page height A4 (297 mm)
          const ML = 12, MR = 12, MT = 12; // Margin 12 mm
          const CW = PW - ML - MR; // Content width: 186 mm
          let y = MT;

          // Palet Warna Dokumen Resmi
          const HEADER_BG = [30, 58, 95];     // Biru navy resmi kedinasan
          const HEADER_TXT = [255, 255, 255]; // Putih bersih
          const YELLOW = [254, 240, 138];     // Kuning divisi (#fef08a)
          const CREAM = [254, 249, 195];      // Kuning muda subtotal (#fef9c3)
          const GRAY = [226, 232, 240];       // Abu-abu grand total (#e2e8f0)
          const WHITE = [255, 255, 255];
          const BLACK = [0, 0, 0];

          // Proporsi 11 Kolom Komparasi untuk Lebar Portrait 186 mm
          // [NO, URAIAN, VOL, SAT, H.SAT, TOTAL, VOL, SAT, H.SAT, TOTAL, SELISIH]
          const colWidths = [6.5, 46.5, 10, 8, 18, 22, 10, 8, 18, 22, 17];
          const colX = [ML];
          for (let i = 0; i < colWidths.length - 1; i++) colX.push(colX[i] + colWidths[i]);

          const ROW_H = 5.2;
          const HEAD_H = 4.5;

          // Helper: Gambar Baris dengan Border Sel Lengkap (Mendukung multi-baris otomatis)
          const drawBorderRow = (cols, rowY, rowH, bgColor = WHITE, isBold = false, fontSize = 6.8) => {
            doc.setFillColor(...bgColor);
            doc.rect(ML, rowY, CW, rowH, "F");
            doc.setFont("times", isBold ? "bold" : "normal");
            doc.setFontSize(fontSize);
            doc.setTextColor(...BLACK);

            cols.forEach((col, i) => {
              const { text, align = "center" } = typeof col === "string" ? { text: col } : col;
              const cx = colX[i];
              const cw = colWidths[i];
              const tx = align === "right" ? cx + cw - 1.2 : align === "left" ? cx + 1.2 : cx + cw / 2;
              const lines = doc.splitTextToSize(String(text ?? ""), cw - 2);

              if (lines.length > 1) {
                doc.text(lines[0], tx, rowY + 3.0, { align });
                doc.text(lines[1], tx, rowY + 6.0, { align });
              } else {
                doc.text(lines[0] || "", tx, rowY + rowH / 2 + 1.1, { align });
              }

              // Garis border sel hitam tegas
              doc.setDrawColor(0, 0, 0);
              doc.setLineWidth(0.2);
              doc.rect(cx, rowY, cw, rowH);
            });
          };

          // Helper: Header Tabel Komparasi 2 Tingkat
          const drawTableHeader = () => {
            const hY = y;
            doc.setFillColor(...HEADER_BG);
            doc.setTextColor(...HEADER_TXT);
            doc.setFont("times", "bold");
            doc.setDrawColor(0, 0, 0);
            doc.setLineWidth(0.2);

            // NO (rowspan 2)
            doc.setFontSize(7);
            doc.rect(colX[0], hY, colWidths[0], HEAD_H * 2, "FD");
            doc.text("NO", colX[0] + colWidths[0] / 2, hY + HEAD_H + 1.1, { align: "center" });

            // URAIAN PEKERJAAN (rowspan 2)
            doc.setFontSize(7);
            doc.rect(colX[1], hY, colWidths[1], HEAD_H * 2, "FD");
            doc.text("URAIAN PEKERJAAN", colX[1] + colWidths[1] / 2, hY + HEAD_H + 1.1, { align: "center" });

            // RENCANA (colspan 4: 58 mm)
            const rencW = colWidths[2] + colWidths[3] + colWidths[4] + colWidths[5];
            doc.setFontSize(7.2);
            doc.rect(colX[2], hY, rencW, HEAD_H, "FD");

            // REALISASI (colspan 4: 58 mm)
            const realW = colWidths[6] + colWidths[7] + colWidths[8] + colWidths[9];
            doc.rect(colX[6], hY, realW, HEAD_H, "FD");

            // SELISIH (rowspan 2)
            doc.setFontSize(6.2);
            doc.rect(colX[10], hY, colWidths[10], HEAD_H * 2, "FD");
            doc.text("SELISIH (RP)", colX[10] + colWidths[10] / 2, hY + HEAD_H + 1.1, { align: "center" });

            // Sub-kolom RENCANA & REALISASI (Baris 2)
            const subY = hY + HEAD_H;
            const subHeaders = ["VOL", "SAT", "H. SATUAN", "TOTAL (RP)", "VOL", "SAT", "H. SATUAN", "TOTAL (RP)"];
            const subIdx = [2, 3, 4, 5, 6, 7, 8, 9];

          };

          // ── 1. KOP SURAT RESMI INSTANSI / KONTRAKTOR ───────────────────

          y += 3.8;
          doc.setFont("times", "normal");
          doc.setFontSize(8);
          doc.text(state.company.address || (state.project.city + ", " + state.project.province), ML, y);

          // Logo & Nomor Dokumen di sisi kanan (Ditempatkan terpisah agar tidak saling menabrak)

            try {
              doc.addImage(state.company.logo, "PNG", PW - MR - 24, MT - 1, 24, 11);
            } catch(e) {}
            doc.setFont("times", "normal");
            doc.setFontSize(7.5);
            const docNo = "No. Dok: " + (state.company.docNumber || "048/EST-RAB/AKN/XI/2026");
            doc.text(docNo, PW - MR, MT + 14.5, { align: "right" });
          } else {
            doc.setFont("times", "normal");
            doc.setFontSize(8);
            const docNo = "No. Dok: " + (state.company.docNumber || "048/EST-RAB/AKN/XI/2026");
            doc.text(docNo, PW - MR, MT + 4, { align: "right" });

          y += 3.5;
          // Garis Kop Ganda (Tebal + Tipis)

          doc.line(ML, y, PW - MR, y);
          y += 1.2;
          doc.setLineWidth(0.2);
          doc.line(ML, y, PW - MR, y);
          y += 5;

          // ── 2. JUDUL LAPORAN RESMI ─────────────────────────────────────
          doc.setFont("times", "bold");
          doc.setFontSize(12);
          doc.text("LAPORAN RENCANA DAN REALISASI ANGGARAN", PW / 2, y, { align: "center" });
          y += 4.5;
          doc.setFontSize(10);
          doc.text("PROYEK: " + (state.project.name || "PEMBANGUNAN GEDUNG").toUpperCase(), PW / 2, y, { align: "center" });

          doc.setTextColor(...BLACK);

          doc.setFontSize(7.2);
          doc.setTextColor(...BLACK);
          const subW1 = colWidths[0] + colWidths[1] + colWidths[2] + colWidths[3] + colWidths[4];
          doc.text("SUBTOTAL FISIK", colX[0] + subW1 - 1.5, y + ROW_H / 2 + 1.1, { align: "right" });
          doc.text(rupiah(sum.subtotal), colX[5] + colWidths[5] - 1.2, y + ROW_H / 2 + 1.1, { align: "right" });
          const subW2 = colWidths[6] + colWidths[7] + colWidths[8];

          // ── 5. BAGIAN B: OVERHEAD & PAJAK ───────────────────────────────

          const gtW1 = colWidths[0] + colWidths[1] + colWidths[2] + colWidths[3] + colWidths[4];
          doc.text("JUMLAH TOTAL", colX[0] + gtW1 / 2, y + 4.1, { align: "center" });

          doc.text("-", colX[10] + colWidths[10] / 2, y + 4.1, { align: "center" });
          doc.setDrawColor(0, 0, 0);
          doc.setLineWidth(0.4);
          doc.rect(ML, y, CW, 6.2);

          "",

          "",
          "",
          "",

          "",

          "",
          "",
          { t: "n", v: sum.overhead, f: `G${subtotalRowIdx}*(${state.rates.overhead}/100)` },

        rabData.push([
          "",
          "",
          `Pajak Pertambahan Nilai (PPN ${state.rates.tax}%)`,
          "",
          "",
          "",
          { t: "n", v: sum.tax, f: `(G${subtotalRowIdx}+G${overheadRowIdx})*(${state.rates.tax}/100)` },
          "",
        ]);

        rabData.push([
          "",
          "",
          "TOTAL ANGGARAN BIAYA (GRAND TOTAL)",
          "",
          "",
          "",
          { t: "n", v: sum.grand, f: `G${subtotalRowIdx}+G${overheadRowIdx}+G${taxRowIdx}` },
          "",

        const wsRab = XLSX.utils.aoa_to_sheet(rabData);
        wsRab["!cols"] = [
          { wch: 6 },
          { wch: 18 },
          { wch: 40 },
          { wch: 10 },
          { wch: 10 },
          { wch: 18 },
          { wch: 20 },
          { wch: 14 },
        ];

        // ------------------------------------------
        // SHEET 2: "Jadwal & Kurva S"
        // ------------------------------------------
        const jadwalHeader = ["NO", "DIVISI", "URAIAN PEKERJAAN", "BOBOT (%)", "MULAI (MG)", "DURASI (MG)"];
        for (let w = 1; w <= sched.totalDuration; w++) {
          jadwalHeader.push(`MG ${w}`);
        }
        jadwalHeader.push("TOTAL BOBOT (%)");

        const jadwalData = [
          [`ESTICON — ${state.company.name.toUpperCase()}`],
          [`JADWAL PELAKSANAAN MINGGUAN & DISTRIBUSI BOBOT KURVA S | No: ${state.company.docNumber}`],
          [`Proyek: ${state.project.name} | Total Durasi: ${sched.totalDuration} Minggu`],
          [],
          jadwalHeader,
        ];

        const startJadwalJobRow = 6;

        sched.jobRows.forEach((row, idx) => {
          const r = startJadwalJobRow + idx;
          const rowArr = [
            idx + 1,
            row.job.division,
            row.job.name,
            Number(row.weight.toFixed(2)),
            row.start,
            row.dur,
          ];

          for (let w = 0; w < sched.totalDuration; w++) {
            rowArr.push(Number(row.weekPills[w].toFixed(2)));
          }

          // Huruf Kolom Excel untuk Penjumlahan Total Minggu
          const getColLetter = (colIndex) => {
            let temp, letter = "";
            while (colIndex > 0) {
              temp = (colIndex - 1) % 26;
              letter = String.fromCharCode(65 + temp) + letter;
              colIndex = (colIndex - temp - 1) / 26;
            }
            return letter;
          };

          const firstWeekCol = getColLetter(7);
          const lastWeekCol = getColLetter(6 + sched.totalDuration);
          rowArr.push({ t: "n", v: Number(row.weight.toFixed(2)), f: `SUM(${firstWeekCol}${r}:${lastWeekCol}${r})` });

          jadwalData.push(rowArr);
        });

        // Baris Rencana Mingguan
        const weeklySummaryRow = ["", "", "BOBOT RENCANA MINGGUAN (%)", 100, "", ""];
        for (let w = 0; w < sched.totalDuration; w++) {
          weeklySummaryRow.push(Number(sched.weeklyTotalWeights[w].toFixed(2)));
        }
        weeklySummaryRow.push({ t: "n", v: 100, f: `SUM(G${startJadwalJobRow + jobCount}:G${startJadwalJobRow + jobCount})` });
        jadwalData.push(weeklySummaryRow);

        // Baris Rencana Kumulatif
        const cumSummaryRow = ["", "", "BOBOT KUMULATIF RENCANA (%)", 100, "", ""];
        for (let w = 0; w < sched.totalDuration; w++) {
          cumSummaryRow.push(Number(sched.cumulativeWeights[w].toFixed(2)));
        }
        cumSummaryRow.push(100);
        jadwalData.push(cumSummaryRow);

        const wsJadwal = XLSX.utils.aoa_to_sheet(jadwalData);
        wsJadwal["!cols"] = [
          { wch: 6 },
          { wch: 16 },
          { wch: 36 },
          { wch: 12 },
          { wch: 12 },
          { wch: 12 },
          ...Array(sched.totalDuration).fill({ wch: 10 }),
          { wch: 16 },
        ];

        // Masukkan Sheet ke Workbook
        XLSX.utils.book_append_sheet(wb, wsRab, "RAB Lengkap");
        XLSX.utils.book_append_sheet(wb, wsJadwal, "Jadwal & Kurva S");

        // Unduh Berkas Excel
        const fileName = `ESTICON_RAB_KurvaS_${state.project.name.replace(/[^a-zA-Z0-9]/g, "_")}.xlsx`;
        XLSX.writeFile(wb, fileName);
        showToast("Rincian Excel (.xlsx) dengan rumus aktif berhasil diunduh!");
      }

      // ==========================================
      // 7. EFEK KURSOR WAVE & RIPPLE TRAIL
      // ==========================================
      function initCursorTrail() {
        const canvas = document.getElementById("cursor-trail-canvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        window.addEventListener("resize", () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        });

        const points = [];
        const ripples = [];

        window.addEventListener("pointermove", (e) => {
          points.push({
            x: e.clientX,
            y: e.clientY,
            age: 0,
            maxAge: 25,
            vx: (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 1.5,
          });
          if (points.length > 40) points.shift();
        });

        window.addEventListener("pointerdown", (e) => {
          ripples.push({
            x: e.clientX,
            y: e.clientY,
            radius: 4,
            maxRadius: 45,
            alpha: 0.8,
          });
        });

        function animateCursorTrail() {
          ctx.clearRect(0, 0, width, height);
          const isDark = currentTheme === "dark";

          // 1. Gambar Riak Gelombang saat Klik (Water/Radar Ripple)
          for (let i = ripples.length - 1; i >= 0; i--) {
            const r = ripples[i];
            r.radius += 2.2;
            r.alpha *= 0.94;

            ctx.beginPath();
            ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
            ctx.strokeStyle = isDark ? `rgba(96, 165, 250, ${r.alpha})` : `rgba(37, 99, 235, ${r.alpha})`;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Cincin kedua yang lebih lembut
            if (r.radius > 12) {
              ctx.beginPath();
              ctx.arc(r.x, r.y, r.radius * 0.65, 0, Math.PI * 2);
              ctx.strokeStyle = isDark ? `rgba(147, 197, 253, ${r.alpha * 0.7})` : `rgba(56, 189, 248, ${r.alpha * 0.6})`;
              ctx.lineWidth = 1.2;
              ctx.stroke();
            }

            if (r.alpha < 0.02 || r.radius >= r.maxRadius) {
              ripples.splice(i, 1);
            }
          }

          // 2. Gambar Gelombang Ekor Pointer (Smooth Wave Trail)
          if (points.length > 2) {
            for (let i = 0; i < points.length; i++) {
              const p = points[i];
              p.age++;
              p.x += p.vx;
              p.y += p.vy;
            }

            // Hapus titik yang sudah habis masa aktifnya
            while (points.length > 0 && points[0].age >= points[0].maxAge) {
              points.shift();
            }

            // Gambar pita gelombang halus dengan kurva
            for (let i = 1; i < points.length; i++) {
              const prev = points[i - 1];
              const curr = points[i];
              const progress = i / points.length;
              const alpha = progress * (isDark ? 0.75 : 0.6);

              ctx.beginPath();
              ctx.moveTo(prev.x, prev.y);
              ctx.lineTo(curr.x, curr.y);
              ctx.strokeStyle = isDark ? `rgba(96, 165, 250, ${alpha})` : `rgba(37, 99, 235, ${alpha})`;
              ctx.lineWidth = progress * 4.5;
              ctx.lineCap = "round";
              ctx.stroke();
            }
          }

          requestAnimationFrame(animateCursorTrail);
        }

        animateCursorTrail();
      }

      // ==========================================
      // 8. EVENT BINDING & INTERAKTIVITAS REAL-TIME
      // ==========================================
      function showToast(msg) {
        document.querySelector(".toast")?.remove();
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.innerHTML = `<span>ℹ️</span> <span>${msg}</span>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2800);
      }

      function refreshComputed() {
        if (currentStep === 1) {
          const dim = dimensions();
          const dTot = document.getElementById("dim-total");
          const dFl = document.getElementById("dim-floor");
          const dPer = document.getElementById("dim-perimeter");
          const dH = document.getElementById("dim-height");
          if (dTot) dTot.textContent = rupiah(dim.total);
          if (dFl) dFl.textContent = `${rupiah(dim.perFloor)} m²`;
          if (dPer) dPer.textContent = `${rupiah(dim.perimeter)} m`;
          if (dH) dH.textContent = `${rupiah(dim.height)} m`;
        }

        if (currentStep === 2) {
          const { subtotal } = totals();
          document.querySelectorAll("[data-job-total]").forEach((el) => {
            const idx = Number(el.dataset.jobTotal);
            if (state.jobs[idx]) el.textContent = `Rp ${rupiah(jobTotal(state.jobs[idx]))}`;
          });
          document.querySelectorAll("[data-job-weight]").forEach((el) => {
            const idx = Number(el.dataset.jobWeight);
            if (state.jobs[idx]) {
              const cost = jobTotal(state.jobs[idx]);
              const weight = subtotal > 0 ? (cost / subtotal) * 100 : 0;
              el.textContent = `${weight.toFixed(2)}%`;
            }
          });
          const dSub = document.getElementById("division-subtotal");
          if (dSub) dSub.textContent = `Rp ${rupiah(divisionTotal(activeDivision))}`;
        }

        if (currentStep === 4) {
          initKurvaSChart();
        }

        persist();
      }

      function navigate(step) {
        if (step === "landing" || step === null) {
          history.replaceState(null, "", "#landing");
          render();
          window.scrollTo({ top: 0, behavior: "instant" });
          return;
        }
        currentStep = Math.max(0, Math.min(4, Number(step) || 0));
        history.replaceState(null, "", `#tahap-${currentStep + 1}`);
        render();
        window.scrollTo({ top: 0, behavior: "instant" });
      }

      function bindEvents() {
        // Navigasi Langkah
        document.querySelectorAll("[data-step]").forEach((el) => el.addEventListener("click", () => navigate(Number(el.dataset.step))));
        document.querySelector("[data-next]")?.addEventListener("click", () => navigate(currentStep + 1));
        document.querySelector("[data-back]")?.addEventListener("click", () => navigate(currentStep - 1));
        document.querySelector("[data-save]")?.addEventListener("click", () => {
          persist();
          showToast("Seluruh draf berhasil disimpan di peramban!");
        });
        document.querySelector("[data-print-report]")?.addEventListener("click", () => window.print());
        document.querySelector("[data-export-pdf]")?.addEventListener("click", exportToPdf);
        document.querySelector("[data-export-excel]")?.addEventListener("click", exportToExcel);

        // Toggle Tema Dark / Light
        document.querySelectorAll("[data-toggle-theme]").forEach((btn) => btn.addEventListener("click", toggleTheme));

        // Upload Logo Perusahaan
        const logoInput = document.getElementById("company-logo-input");
        if (logoInput) {
          logoInput.addEventListener("change", (e) => {
            const file = e.target.files?.[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (event) => {
                state.company.logo = event.target.result;
                persist();
                render();
                showToast("Logo perusahaan berhasil diunggah dan disimpan!");
              };
              reader.readAsDataURL(file);
            }
          });
        }

        // Hapus Logo Perusahaan
        document.querySelector("[data-remove-logo]")?.addEventListener("click", () => {
          state.company.logo = "";
          persist();
          render();
          showToast("Logo kustom dihapus (kembali ke logo bawaan).");
        });

        document.querySelector("[data-reset]")?.addEventListener("click", () => {
          if (window.confirm("Kembalikan seluruh data ESTICON ke pengaturan awal?")) {
            state = cloneDefaults();
            persist();
            navigate(0);
            showToast("Data berhasil diatur ulang.");
          }
        });

        // Binding Input Form Umum
        document.querySelectorAll("[data-bind]").forEach((el) => {
          const update = () => {
            setPath(el.dataset.bind, el.value);
            refreshComputed();
          };
          el.addEventListener("input", update);
          el.addEventListener("change", update);
        });

        // Binding Baris Pekerjaan di Tab 3
        document.querySelectorAll("[data-job-index][data-job-field]").forEach((el) => {
          const update = () => {
            const idx = Number(el.dataset.jobIndex);
            if (state.jobs[idx]) {
              state.jobs[idx][el.dataset.jobField] = el.value;
              refreshComputed();
            }
          };
          el.addEventListener("input", update);
          el.addEventListener("change", update);
        });

        // Binding Harga Satuan
        document.querySelectorAll("[data-price-key]").forEach((el) => {
          const update = () => {
            const key = el.dataset.priceKey;
            if (state.prices[key]) {
              state.prices[key].value = el.value;
              refreshComputed();
            }
          };
          el.addEventListener("input", update);
          el.addEventListener("change", update);
        });

        document.querySelectorAll("[data-price-name]").forEach((el) =>
          el.addEventListener("input", () => {
            const key = el.dataset.priceName;
            if (state.prices[key]) {
              state.prices[key].name = el.value;
              persist();
            }
          })
        );

        document.querySelectorAll("[data-price-unit]").forEach((el) =>
          el.addEventListener("change", () => {
            const key = el.dataset.priceUnit;
            if (state.prices[key]) {
              state.prices[key].unit = el.value;
              persist();
            }
          })
        );

        // Tab Divisi & Harga
        document.querySelectorAll("[data-division]").forEach((el) =>
          el.addEventListener("click", () => {
            activeDivision = el.dataset.division;
            render();
          })
        );

        document.querySelectorAll("[data-price-tab]").forEach((el) =>
          el.addEventListener("click", () => {
            activePriceTab = el.dataset.priceTab;
            render();
          })
        );

        document.querySelector("[data-price-tab-select]")?.addEventListener("change", (e) => {
          activePriceTab = e.target.value;
          render();
        });

        document.querySelector("[data-price-search]")?.addEventListener("input", (e) => {
          priceSearch = e.target.value;
          const pos = e.target.selectionStart;
          render();
          const inputEl = document.querySelector("[data-price-search]");
          inputEl?.focus();
          inputEl?.setSelectionRange(pos, pos);
        });

        // Tambah & Hapus Pekerjaan
        document.querySelector("[data-add-job]")?.addEventListener("click", () => {
          state.jobs.push({
            division: activeDivision,
            name: "Pekerjaan baru",
            volume: 1,
            unit: "ls",
            startWeek: 1,
            duration: 1,
            priceKey: "worker",
          });
          persist();
          render();
          showToast(`Item pekerjaan baru ditambahkan ke divisi ${activeDivision}.`);
        });

        document.querySelectorAll("[data-delete-job]").forEach((el) =>
          el.addEventListener("click", () => {
            const idx = Number(el.dataset.deleteJob);
            if (state.jobs[idx]) {
              state.jobs.splice(idx, 1);
              persist();
              render();
            }
          })
        );

        // Susun Jadwal Otomatis Cerdas
        document.querySelector("[data-auto-schedule]")?.addEventListener("click", () => {
          let currentWeek = 1;
          DIVISIONS.forEach((div) => {
            const divJobs = state.jobs.filter((j) => j.division === div);
            divJobs.forEach((job) => {
              job.startWeek = currentWeek;
              job.duration = Math.max(1, Math.min(6, Math.ceil(number(job.volume) / 50) || 2));
            });
            if (divJobs.length > 0) currentWeek += 2;
          });
          const maxEnd = Math.max(...state.jobs.map((j) => (Number(j.startWeek) || 1) + (Number(j.duration) || 1) - 1));
          state.schedule.duration = Math.max(12, maxEnd);
          persist();
          render();
          showToast("Jadwal pelaksanaan disusun otomatis berdasarkan divisi pekerjaan.");
        });

        // =====================================
        // FITUR DATABASE AHSP: Hapus item harga
        // =====================================
        document.querySelectorAll("[data-delete-price]").forEach((el) =>
          el.addEventListener("click", () => {
            const key = el.dataset.deletePrice;
            if (state.prices[key]) {
              const nama = state.prices[key].name;
              delete state.prices[key];
              persist();
              render();
              showToast(`Item "${nama}" dihapus dari daftar harga.`);
            }
          })
        );

        // =====================================
        // FITUR DATABASE AHSP: Tambah ke Daftar
        // =====================================
        document.querySelectorAll("[data-ahsp-add]").forEach((el) =>
          el.addEventListener("click", () => {
            const idx = Number(el.dataset.ahspAdd);
            const dbItem = AHSP_DB[idx];
            if (!dbItem) return;

            // Tentukan tab berdasarkan kategori
            let tab = "Bahan & upah";
            if (dbItem.kategori === "Upah") tab = "Bahan & upah";

      // ==========================================
      // TYPEWRITER EFFECT UNTUK TEKS JUDUL LANDING
      // "Kalkulasi Presisi."
      // "Estimasi Konstruksi Terencana."
      // ==========================================
      let twTimer = null;
      function startLandingTypewriter() {
        const line1El = document.getElementById("tw-line1");
        const line2El = document.getElementById("tw-line2");
        const cursorEl = document.getElementById("tw-cursor");
        if (!line1El || !line2El) return;

        if (twTimer) clearTimeout(twTimer);

        line1El.textContent = "";
        line2El.textContent = "";
        if (cursorEl) cursorEl.style.display = "inline-block";

        const text1 = "Kalkulasi Presisi.";
        const text2 = "Estimasi Konstruksi Terencana.";
        let i = 0;
        let j = 0;

        function typeLine1() {
          if (!document.getElementById("tw-line1")) return;
          if (i < text1.length) {
            line1El.textContent += text1.charAt(i);
            i++;
            twTimer = setTimeout(typeLine1, 45);
          } else {
            twTimer = setTimeout(typeLine2, 180);
          }
        }

        function typeLine2() {
          if (!document.getElementById("tw-line2")) return;
          if (j < text2.length) {
            line2El.textContent += text2.charAt(j);
            j++;
            twTimer = setTimeout(typeLine2, 40);
          } else {
            // Selesai diketik, sembunyikan kursor setelah jeda
            twTimer = setTimeout(() => {
              if (cursorEl) cursorEl.style.display = "none";
            }, 3000);
          }
        }

        typeLine1();
      }

      // ==========================================
      // PARTIKEL TITIK BANYAK: SEGITIGA ↔ PERSEGI (MORPHING)
      // DENGAN ROTASI SEARAH JARUM JAM & MENGIKUTI ARAH KURSOR (ANTIGRAVITY STYLE)
      // ==========================================
      let bgParticleAnimId = null;
      function initMorphingParticles() {
        const canvas = document.getElementById("ag-bg-particles");
        if (!canvas) return;

        const ctx = canvas.getContext("2d");
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const onResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener("resize", onResize);

        // Posisi kursor mouse & posisi kelompok partikel yang mengikutinya
        let targetX = width / 2;
        let targetY = Math.min(height * 0.42, 340);
        let currentX = targetX;
        let currentY = targetY;

        // Kecepatan gerakan mouse untuk efek inertia / dynamic tilt
        let mouseSpeedX = 0;
        let mouseSpeedY = 0;
        let lastMouseX = targetX;
        let lastMouseY = targetY;

        window.addEventListener("mousemove", (e) => {
          targetX = e.clientX;
          targetY = e.clientY;
          mouseSpeedX = e.clientX - lastMouseX;
          mouseSpeedY = e.clientY - lastMouseY;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
        });

        // 240 partikel titik padat
        const totalPoints = 240;
        const particles = [];

        function getTrianglePoint(t) {
          const p0 = [-0.95, 0.82];
          const p1 = [0.95, 0.82];
          const p2 = [0, -0.88];
          const seg = t * 3;
          if (seg < 1) {
            const u = seg;
            return [p0[0] + (p1[0] - p0[0]) * u, p0[1] + (p1[1] - p0[1]) * u];
          } else if (seg < 2) {
            const u = seg - 1;
            return [p1[0] + (p2[0] - p1[0]) * u, p1[1] + (p2[1] - p1[1]) * u];
          } else {
            const u = seg - 2;
            return [p2[0] + (p0[0] - p2[0]) * u, p2[1] + (p0[1] - p2[1]) * u];
          }
        }

        function getSquarePoint(t) {
          const seg = t * 4;
          if (seg < 1) {
            return [-0.82 + 1.64 * seg, -0.82];
          } else if (seg < 2) {
            return [0.82, -0.82 + 1.64 * (seg - 1)];
          } else if (seg < 3) {
            return [0.82 - 1.64 * (seg - 2), 0.82];
          } else {
            return [-0.82, 0.82 - 1.64 * (seg - 3)];
          }
        }

        for (let i = 0; i < totalPoints; i++) {
          const isPerimeter = i < 150;
          let triPos, sqPos;

          if (isPerimeter) {
            const perimT = i / 150;
            triPos = getTrianglePoint(perimT);
            sqPos = getSquarePoint(perimT);
          } else {
            const seedX = (Math.sin(i * 12.9898) * 43758.5453) % 1;
            const seedY = (Math.cos(i * 78.233) * 43758.5453) % 1;
            const rX = Math.abs(seedX) * 1.3 - 0.65;
            const rY = Math.abs(seedY) * 1.3 - 0.65;
            triPos = [rX * 0.72, rY * 0.72 + 0.08];
            sqPos = [rX * 0.75, rY * 0.75];
          }

          const colors = [
            "rgba(37, 99, 235, ",
            "rgba(56, 189, 248, ",
            "rgba(99, 102, 241, ",
            "rgba(147, 197, 253, ",
            "rgba(139, 92, 246, "
          ];
          const colorBase = colors[i % colors.length];

          // Jarak dan offset relatif titik
          const radiusBase = Math.random() * 1.6 + 1.1;

          particles.push({
            triPos,
            sqPos,
            radius: radiusBase,
            baseAlpha: Math.random() * 0.45 + 0.4,
            colorBase,
            phaseOffset: Math.random() * Math.PI * 2,
            lagFactor: 0.045 + (i % 7) * 0.008, // Tiap partikel sedikit elastis/delay menghasilkan efek fluid swarm
            driftX: (Math.random() - 0.5) * 0.03,
            driftY: (Math.random() - 0.5) * 0.03,
            curPx: targetX,
            curPy: targetY
          });
        }

        let globalAngle = 0; // Rotasi searah jarum jam (clockwise)
        let morphT = 0;     // Parameter transformasi 0 (segitiga) <-> 1 (persegi)
        let morphSpeed = 0.0055;
        let morphDir = 1;

        function animate() {
          if (!document.getElementById("ag-bg-particles")) {
            if (bgParticleAnimId) cancelAnimationFrame(bgParticleAnimId);
            return;
          }

          ctx.clearRect(0, 0, width, height);

          // Pusat konstelasi mendekati target kursor secara halus (fluid smooth follow)
          currentX += (targetX - currentX) * 0.085;
          currentY += (targetY - currentY) * 0.085;

          // Rotasi pelan searah jarum jam
          globalAngle += 0.004;

          // Siklus morphing segitiga <-> persegi dengan smooth easing
          morphT += morphSpeed * morphDir;
          if (morphT >= 1) {
            morphT = 1;
            morphDir = -1;
          } else if (morphT <= 0) {
            morphT = 0;
            morphDir = 1;
          }
          const easeMorph = 0.5 - 0.5 * Math.cos(morphT * Math.PI);

          // Skala konstelasi
          const shapeScale = Math.min(width, height) * 0.25;

          const cosRot = Math.cos(globalAngle);
          const sinRot = Math.sin(globalAngle);

          // Render tiap partikel
          particles.forEach((p) => {
            const lx = p.triPos[0] + (p.sqPos[0] - p.triPos[0]) * easeMorph + p.driftX;
            const ly = p.triPos[1] + (p.sqPos[1] - p.triPos[1]) * easeMorph + p.driftY;

            // Rotasi searah jarum jam
            const rx = lx * cosRot - ly * sinRot;
            const ry = lx * sinRot + ly * cosRot;

            // Posisi ideal di sekitar pusat kursor
            const destX = currentX + rx * shapeScale;
            const destY = currentY + ry * shapeScale;

            // Efek lag elastis mengikuti pusat
            p.curPx += (destX - p.curPx) * p.lagFactor * 2.2;
            p.curPy += (destY - p.curPy) * p.lagFactor * 2.2;

            // Reaktivitas lokal kursor (sedikit repel jika tepat di titik kursor)
            const dx = p.curPx - targetX;
            const dy = p.curPy - targetY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            let drawX = p.curPx;
            let drawY = p.curPy;
            if (dist < 80 && dist > 0) {
              const push = (1 - dist / 80) * 12;
              drawX += (dx / dist) * push;
              drawY += (dy / dist) * push;
            }

            // Alpha berkedip lembut
            const alphaPulse = Math.sin(Date.now() * 0.0022 + p.phaseOffset) * 0.15;
            const alpha = Math.max(0.18, Math.min(0.9, p.baseAlpha + alphaPulse));

            ctx.beginPath();
            ctx.arc(drawX, drawY, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `${p.colorBase}${alpha})`;
            ctx.shadowBlur = 6;
            ctx.shadowColor = "rgba(56, 189, 248, 0.4)";
            ctx.fill();
          });

          bgParticleAnimId = requestAnimationFrame(animate);
        }

        animate();
      }

      function render() {
        if (isLanding()) {
          app.innerHTML = landingScreen();
          bindLandingEvents();
          initConstruction3DAnimation();
          startLandingTypewriter();
          initMorphingParticles();
        } else {
          app.innerHTML = shell(screens[currentStep]());
          bindEvents();
          if (currentStep === 4) {
            // Render Chart.js setelah elemen canvas ada di DOM
            setTimeout(initKurvaSChart, 40);
          }
        }
      }

      window.addEventListener("hashchange", () => {
        if (isLanding()) {
          render();
          return;
        }
        const req = Number(location.hash.replace("#tahap-", "")) - 1;
        if (req >= 0 && req <= 4 && req !== currentStep) navigate(req);
      });

      // Jalankan Aplikasi & Kursor Animasi
      render();
      initCursorTrail();
    </script>
  </body>
</html>
